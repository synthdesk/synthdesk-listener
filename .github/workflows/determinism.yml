name: determinism-gate

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  verify-determinism:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: verify frozen regime epoch
        run: |
          python scripts/verify_day.py baselines/2025-12-30
