[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthdesk-listener"
version = "0.2.0"
description = "Input capture and event emission daemon"
requires-python = ">=3.10"
dependencies = [
    "synthdesk-spine>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["synthdesk_listener*", "synthdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
