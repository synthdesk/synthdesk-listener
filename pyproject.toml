[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthdesk-listener"
version = "0.2.0"
description = "Input capture and event emission daemon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "synthdesk-spine>=0.1.0",
  "websockets>=12.0",
]

[project.scripts]
synthdesk-listener = "synthdesk_listener.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["synthdesk_listener*", "synthdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
